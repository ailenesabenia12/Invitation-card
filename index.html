<!DOCTYPE html>
<html><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lovemae Birthday - 3D Canva</title>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#ffe4e6; font-family:'Poppins',sans-serif; min-height:100vh; display:flex; align-items:center; justify-content:center;}
#tapScreen{position:fixed; inset:0; background:linear-gradient(135deg,#ff9a9e,#ff6b81); z-index:9999; display:flex; flex-direction:column; align-items:center; justify-content:center; cursor:pointer;}
#tapScreen h1{font-family:'Great Vibes'; font-size:50px; color:white;}
.tapBtn{background:white; color:#ff2e63; padding:14px 28px; border-radius:30px; font-weight:700; margin-top:15px; box-shadow:0 10px 30px rgba(0,0,0,0.2);}
.card{width:360px; min-height:560px; background:white; border-radius:20px; box-shadow:0 20px 60px rgba(0,0,0,0.3); overflow:hidden; position:relative; transform: rotateY(-3deg); transition:0.5s;}
.card:hover{transform: rotateY(0deg) scale(1.02);}
.bg{position:absolute; inset:0; background:url('https://images.unsplash.com/photo-1518895949257-7621c3c786d7?w=600') center/cover;}
.overlay{background:rgba(255,255,255,0.85); backdrop-filter:blur(1px); margin:15px; border-radius:15px; padding:20px; text-align:center; min-height:530px; position:relative; border:2px solid #ffb3c6;}
.pic{width:100px; height:100px; border-radius:50%; object-fit:cover; border:4px solid white; box-shadow:0 5px 15px rgba(0,0,0,0.2); margin:0 auto 10px; display:none;}
h2{font-family:'Great Vibes'; font-size:40px; color:#d81b60;}
.name{font-size:22px; color:#ff1744; font-weight:700; margin:8px 0; cursor:pointer;}
.badge{background:#ff1744; color:white; padding:8px 18px; border-radius:20px; display:inline-block; margin:10px 0;}
#controls{position:fixed; bottom:10px; left:10px; right:10px; background:white; padding:10px; border-radius:15px; display:flex; gap:5px; box-shadow:0 5px 20px rgba(0,0,0,0.2);}
#controls button,#controls label{flex:1; padding:8px; border-radius:10px; border:none; font-size:11px; font-weight:700; cursor:pointer; text-align:center;}
input[type=file]{display:none;}
</style></head><body>

<div id="tapScreen" onclick="openCard()">
  <div style="font-size:60px;">💌</div>
  <h1>Lovemae's Birthday</h1>
  <p style="color:white;">Tap to open + music 🎶</p>
  <div class="tapBtn">👆 Tap Here</div>
</div>

<div class="card" id="card">
  <div class="bg"></div>
  <div class="overlay">
    <div>🎉 You're Invited! 🎉</div>
    <img id="userPic" class="pic" src="">
    <div class="name" id="guestName" onclick="editName()">Hi, Kristine! ❤️</div>
    <div style="font-size:11px; color:#ff6b81;">pindutin pangalan para palitan</div>
    <p style="font-size:13px; margin-top:8px;">Join us to celebrate</p>
    <h2>Lovemae's<br>Birthday Party</h2>
    <div style="font-size:50px;">🎂</div>
    <div class="badge">Dec 29 • 6PM</div>
    <div style="font-size:13px; margin-top:8px;">📍 Quezon City Circle</div>
    <div style="font-size:12px; margin-top:5px;">We can't wait to see you!</div>
  </div>
</div>

<div id="controls">
  <label for="uploadPic" style="background:#fff0f5; border:1px solid #ffb3c6;">🖼️ Picture</label>
  <input type="file" id="uploadPic" accept="image/*" onchange="loadPic(event)">
  <button style="background:#ff6b81; color:white;" onclick="changeBG()">🎨 Design</button>
  <button style="background:#222; color:white;" onclick="toggleMusic()" id="musicBtn">🔊 Music</button>
</div>

<audio id="audio" loop><source src="https://www.singing-bell.com/wp-content/uploads/2016/03/Happy-Birthday-Song-cheerful-Singing-Bell.mp3"></audio>

<script>
const params=new URLSearchParams(location.search);
let g=params.get('name')||'Kristine';
document.getElementById('guestName').innerText=`Hi, ${g}! ❤️`;
function openCard(){document.getElementById('tapScreen').style.display='none'; document.getElementById('audio').play().catch(()=>{}); document.getElementById('musicBtn').innerText='⏸️ Pause';}
function editName(){let n=prompt('Anong pangalan?',g); if(n){g=n; document.getElementById('guestName').innerText=`Hi, ${n}! ❤️`;}}
function loadPic(e){let f=e.target.files[0]; if(!f) return; let r=new FileReader(); r.onload=function(ev){let img=document.getElementById('userPic'); img.src=ev.target.result; img.style.display='block';}; r.readAsDataURL(f);}
let bgIdx=0; const bgs=["https://images.unsplash.com/photo-1518895949257-7621c3c786d7?w=600","https://images.unsplash.com/photo-1513151233558-d860c5398176?w=600","https://images.unsplash.com/photo-1530103862676-de8c9debad1d?w=600","https://images.unsplash.com/photo-1527529482837-4698179dc6ce?w=600"];
function changeBG(){bgIdx=(bgIdx+1)%bgs.length; document.querySelector('.bg').style.backgroundImage=`url('${bgs[bgIdx]}')`;}
let playing=false; function toggleMusic(){let a=document.getElementById('audio'); let b=document.getElementById('musicBtn'); if(!playing){a.play(); b.innerText='⏸️ Pause'; playing=true;} else{a.pause(); b.innerText='🔊 Music'; playing=false;}}
</script></body></html>
