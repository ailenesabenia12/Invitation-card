<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Birthday Ailene - June 12</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:white;min-height:100vh;font-family:Arial;display:flex;justify-content:center;align-items:flex-start;padding:20px 0;overflow-y:auto}
.envelope{position:fixed;inset:0;background:#ff8fab;display:flex;flex-direction:column;justify-content:center;align-items:center;z-index:100;cursor:pointer}
.envelope.hide{transform:translateY(-100%);transition:0.6s}
.card{width:92%;max-width:380px;background:white;border-radius:25px;box-shadow:0 10px 30px rgba(0,0,0,0.2);overflow:visible;text-align:center;z-index:10;margin:auto}
.media-box{width:100%;height:380px;background:white;position:relative;overflow:hidden;border-radius:25px 25px 0 0}
.media-box img,.media-box video{width:100%;height:100%;object-fit:cover;position:absolute;top:0;left:0}
.title{font-size:20px;color:#ff2e7a;line-height:1.3;padding:12px;background:white}
.content{padding:15px;background:white;border-radius:0 0 25px 25px}
h2{color:#ff2e7a;margin:10px 0;font-size:22px}
p{margin:8px 0}
button{background:#ff2e7a;color:white;border:none;padding:9px 14px;border-radius:20px;margin:4px;font-size:13px}
input{margin:5px;font-size:12px;width:90%}
#linkBox{width:88%;padding:8px;border:1px solid #ddd;border-radius:8px;font-size:11px}
.balloon{position:fixed;font-size:28px;bottom:-60px;animation:fly 7s infinite linear;z-index:1;pointer-events:none}
@keyframes fly{0%{transform:translateY(0)}100%{transform:translateY(-130vh)}}
.b1{left:5%}.b2{left:22%;animation-delay:1s}.b3{left:48%;animation-delay:2s}.b4{left:70%;animation-delay:0.5s}.b5{left:88%;animation-delay:1.5s}
</style>
</head>
<body>

<div class="balloon b1">🎈</div>
<div class="balloon b2">🎈</div>
<div class="balloon b3">🎉</div>
<div class="balloon b4">🎈</div>
<div class="balloon b5">🎊</div>

<div class="envelope" id="envelope" onclick="openCard()">
<div style="font-size:70px">💌</div>
<h2 style="color:white">Tap to Open</h2>
<p style="color:white">You are Invited!</p>
</div>

<div class="card">
<div class="media-box" id="mediaBox"></div>
<div class="title">Birthday Ailene<br>June 12<br>Circle Quezon City</div>
<div class="content">
<h2>You Are Invited!</h2>
<p>💖 Celebration ni Ailene 💖</p>
<input type="file" id="bgFile" accept="image/*,video/mp4">
<button onclick="uploadBG()">UPLOAD PIC / VIDEO</button><br>
<input type="file" id="musicFile" accept="audio/*">
<button onclick="uploadMusic()">UPLOAD MUSIC MP3</button>
<button onclick="playMusic()">▶️ PLAY MUSIC</button><br>
<input id="linkBox" readonly>
<button onclick="copyLink()">📋 COPY LINK</button>
<button onclick="clearAll()">🗑️ CLEAR</button>
</div>
</div>

<audio id="myAudio" loop></audio>

<script>
const box=document.getElementById('mediaBox');
const audio=document.getElementById('myAudio');
const linkBox=document.getElementById('linkBox');
linkBox.value=location.href;
function openCard(){document.getElementById('envelope').classList.add('hide'); if(audio.src) audio.play().catch(()=>{})}
function uploadBG(){
let f=document.getElementById('bgFile').files[0];
if(!f) return alert('Pili ka muna pic o mp4!');
let url=URL.createObjectURL(f);
let old=box.querySelector('img,video'); if(old) old.remove();
if(f.type.startsWith('video')){box.insertAdjacentHTML('beforeend',`<video src="${url}" autoplay loop muted playsinline></video>`)}
else{box.insertAdjacentHTML('beforeend',`<img src="${url}">`)}
}
function uploadMusic(){
let f=document.getElementById('musicFile').files[0];
if(!f) return alert('Pili ka music MP3!');
if(f.type.startsWith('video')) return alert('MP4 yan Love, MP3 dapat sa music!');
let url=URL.createObjectURL(f);
audio.src=url; audio.play().then(()=>alert('Tumutugtog na!')).catch(()=>{});
}
function playMusic(){if(!audio.src) return alert('Upload ka muna MP3!'); audio.play()}
function copyLink(){navigator.clipboard.writeText(linkBox.value).then(()=>alert('Na-copy na!'))}
function clearAll(){location.reload()}
</script>
</body>
</html>
