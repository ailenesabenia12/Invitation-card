<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Birthday Ailene</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:white;font-family:Arial;overflow-y:auto}
.envelope{position:fixed;inset:0;background:#ff8fab;display:flex;flex-direction:column;justify-content:center;align-items:center;z-index:9999;cursor:pointer}
.envelope.hide{display:none!important}
.wrap{width:100%;max-width:400px;margin:0 auto;padding:15px 15px 60px;text-align:center}
.top-title h1{font-family:cursive;font-size:32px;color:#ff2e7a;line-height:1.1}
.card{width:100%;height:480px;background:white;border:2px solid #ffd1e0;border-radius:25px;position:relative;overflow:hidden;box-shadow:0 8px 20px rgba(0,0,0,0.12);margin:12px 0}
#media{position:absolute;inset:0;z-index:1;background:white}
#media img,#media video{width:100%;height:100%;object-fit:cover}
.dragText{position:absolute;left:30px;top:200px;z-index:10;font-family:cursive;font-size:30px;color:#ff2e7a;padding:10px 16px;background:rgba(255,255,255,0.9);border-radius:12px;min-width:150px}
.admin.dragText{border:2px dashed #ff8fab;cursor:grab;touch-action:none}
.guest.dragText{border:2px solid #ff8fab;cursor:text}
.controls{background:#fff0f5;border-radius:20px;padding:15px;margin-top:15px}
button{background:#ff2e7a;color:white;border:none;padding:12px;border-radius:20px;margin:6px;width:92%;font-size:14px;font-weight:bold}
button.small{width:auto;padding:8px 12px;font-size:12px;background:#333;margin:3px}
input{width:92%;margin:8px 0;padding:8px;border-radius:8px;border:1px solid #ddd}
.link{width:92%;padding:9px;border:1px solid #ddd;border-radius:8px;font-size:11px;background:white}
.hidden{display:none!important}
</style>
</head>
<body>
<div class="envelope" id="env">
<div style="font-size:80px">💌</div>
<h2 style="color:white">You are Invited!</h2>
<p style="color:white">Tap to Open</p>
</div>
<div class="wrap">
<div class="top-title"><h1>Birthday Party<br>Ailene<br><span style="font-size:20px">June12 - Circle Quezon City</span></h1></div>
<div class="card"><div id="media"></div><div id="hiText" class="dragText" contenteditable="true">Hi Kristine</div></div>
<div class="outside"><h2>You are invited</h2></div>
<div class="controls" id="adminPanel">
<p style="font-size:11px;color:#ff2e7a;font-weight:bold">ADMIN - SAYO LANG TO</p>
<button class="small" onclick="saveAll()">💾 SAVE CARD</button>
<hr style="margin:10px 0">
<input id="guestNameInput" placeholder="Name ni guest: ex. Mitchene">
<button onclick="generateGuestLink()" style="background:#222">📋 GENERATE GUEST LINK - NAKA SAVE LAHAT</button>
<input id="linkBox" class="link" readonly>
<button onclick="copyLink()">📋 COPY LINK</button>
<button onclick="clearAll()" style="background:#888">🗑️ CLEAR</button>
</div>
<div id="guestPanel" class="hidden"><p style="font-size:13px;color:#666">Tap name para ma-edit 💖</p><button onclick="playMusic()" style="background:#222;margin-top:10px">▶️ PLAY MUSIC</button></div>
</div>
<audio id="myAudio" loop></audio>
<script>
const DEFAULT_BG="cake.mp4"; const DEFAULT_MUSIC="music.mp3";
const params=new URLSearchParams(location.search);
const isGuest=params.has('guest');
const nameParam=params.get('name');
const xParam=params.get('x'); const yParam=params.get('y');
const env=document.getElementById('env'); const hiText=document.getElementById('hiText'); const media=document.getElementById('media'); const audio=document.getElementById('myAudio');
const adminPanel=document.getElementById('adminPanel'); const guestPanel=document.getElementById('guestPanel');
if(isGuest){ adminPanel.classList.add('hidden'); guestPanel.classList.remove('hidden'); }
if(nameParam) hiText.innerText=decodeURIComponent(nameParam);
else{ let t=localStorage.getItem('inv_text'); if(t&&!isGuest) hiText.innerText=t; }
if(xParam) hiText.style.left=xParam+'px'; if(yParam) hiText.style.top=yParam+'px';
if(!isGuest){ let x=localStorage.getItem('inv_x'); if(x&&!xParam) hiText.style.left=x; let y=localStorage.getItem('inv_y'); if(y&&!yParam) hiText.style.top=y; }
function openEnv(){ env.classList.add('hide'); if(audio.src) audio.play().catch(()=>{}); }
env.addEventListener('click', openEnv); env.addEventListener('touchend', e=>{e.preventDefault(); openEnv();});
let isDragging=false, startX, startY, initX, initY, locked=false;
function startDrag(e){ if(isGuest||locked) return; isDragging=true; let p=e.touches?e.touches[0]:e; startX=p.clientX; startY=p.clientY; initX=hiText.offsetLeft; initY=hiText.offsetTop; }
hiText.addEventListener('mousedown', startDrag); hiText.addEventListener('touchstart', startDrag, {passive:false});
window.addEventListener('mousemove', e=>{ if(isGuest||!isDragging||locked) return; hiText.style.left=(initX+e.clientX-startX)+'px'; hiText.style.top=(initY+e.clientY-startY)+'px'; });
window.addEventListener('touchmove', e=>{ if(isGuest||!isDragging||locked) return; e.preventDefault(); let p=e.touches[0]; hiText.style.left=(initX+p.clientX-startX)+'px'; hiText.style.top=(initY+p.clientY-startY)+'px'; },{passive:false});
window.addEventListener('mouseup', ()=>isDragging=false); window.addEventListener('touchend', ()=>isDragging=false);
function saveAll(){ locked=true; localStorage.setItem('inv_text', hiText.innerText); localStorage.setItem('inv_x', hiText.style.left); localStorage.setItem('inv_y', hiText.style.top); alert('Na-save!'); }
function loadAssets(){ fetch(DEFAULT_BG).then(r=>{ if(r.ok) media.innerHTML=`<video src="${DEFAULT_BG}" autoplay loop muted playsinline></video>`; }).catch(()=>{}); fetch(DEFAULT_MUSIC).then(r=>{ if(r.ok) audio.src=DEFAULT_MUSIC; }).catch(()=>{}); }
loadAssets();
function playMusic(){ if(!audio.src) return; audio.play().catch(()=>{}); }
function generateGuestLink(){ let name=document.getElementById('guestNameInput').value||hiText.innerText; let x=parseInt(hiText.style.left)||30; let y=parseInt(hiText.style.top)||200; let base=location.origin+location.pathname; let link=`${base}?guest=1&name=${encodeURIComponent(name)}&x=${x}&y=${y}`; document.getElementById('linkBox').value=link; localStorage.setItem('inv_text', name); }
function copyLink(){ let v=document.getElementById('linkBox').value; if(!v){ generateGuestLink(); v=document.getElementById('linkBox').value; } navigator.clipboard.writeText(v).then(()=>alert('Na-copy na! Buo na card — may cake at music na, naka-save na name!')); }
function clearAll(){ if(confirm('Clear?')){ localStorage.clear(); location.reload(); } }
</script>
</body>
</html>
