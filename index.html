<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Invitation - Ailene</title>
<style>
body{margin:0;background:white;min-height:100vh;display:flex;justify-content:center;align-items:center;font-family:Arial;overflow:hidden}
.envelope{position:fixed;inset:0;background:#ff8fab;display:flex;flex-direction:column;justify-content:center;align-items:center;z-index:100;cursor:pointer}
.envelope.hide{transform:translateY(-100%);transition:0.6s}
.card{width:90%;max-width:360px;background:white;border-radius:25px;box-shadow:0 10px 30px rgba(0,0,0,0.2);overflow:hidden;text-align:center;position:relative;z-index:10}
.media-box{width:100%;height:380px;background:white;position:relative;overflow:hidden}
.media-box img,.media-box video{width:100%;height:100%;object-fit:cover;position:absolute;top:0;left:0}
.content{padding:18px;background:white}
h1{color:#ff2e7a;margin:5px}
button{background:#ff2e7a;color:white;border:none;padding:9px 14px;border-radius:20px;margin:4px;font-size:13px}
input{margin:4px;font-size:12px}
#linkBox{width:85%;padding:6px;border:1px solid #ddd;border-radius:8px;font-size:11px}
.balloon{position:fixed;font-size:32px;bottom:-60px;animation:fly 7s infinite linear;z-index:1}
@keyframes fly{0%{transform:translateY(0)}100%{transform:translateY(-120vh)}}
.b1{left:8%}.b2{left:22%;animation-delay:1s}.b3{left:45%;animation-delay:2s}.b4{left:70%;animation-delay:0.5s}.b5{left:85%;animation-delay:1.5s}
</style>
</head>
<body>

<div class="balloon b1">🎈</div>
<div class="balloon b2">🎈</div>
<div class="balloon b3">🎉</div>
<div class="balloon b4">🎈</div>
<div class="balloon b5">🎊</div>

<div class="envelope" id="envelope" onclick="openCard()">
<div style="font-size:70px">💌</div>
<h2 style="color:white">Tap to Open</h2>
<p style="color:white">You are Invited!</p>
</div>

<div class="card">
<div class="media-box" id="mediaBox"></div>
<div class="content">
<h1>You Are Invited!</h1>
<p>💖 Celebration ni Ailene 💖</p>
<input type="file" id="bgFile" accept="image/*,video/mp4">
<button onclick="uploadBG()">UPLOAD PIC / VIDEO</button><br>
<input type="file" id="musicFile" accept="audio/*">
<button onclick="uploadMusic()">UPLOAD MUSIC</button>
<button onclick="playMusic()">▶️ PLAY MUSIC</button><br>
<input id="linkBox" readonly>
<button onclick="copyLink()">📋 COPY LINK</button>
<button onclick="clearAll()">🗑️ CLEAR</button>
</div>
</div>

<audio id="myAudio" loop></audio>

<script>
const box=document.getElementById('mediaBox');
const audio=document.getElementById('myAudio');
const linkBox=document.getElementById('linkBox');
linkBox.value=location.href;
function openCard(){document.getElementById('envelope').classList.add('hide'); if(audio.src) audio.play().catch(()=>{})}
function showBG(){
let bg=localStorage.getItem('inv_bg');
let type=localStorage.getItem('inv_bg_type');
if(!bg) return;
let old=box.querySelector('img,video'); if(old) old.remove();
if(type==='video'){box.insertAdjacentHTML('beforeend',`<video src="${bg}" autoplay loop muted playsinline></video>`)}
else{box.insertAdjacentHTML('beforeend',`<img src="${bg}">`)}
}
function uploadBG(){
let f=document.getElementById('bgFile').files[0];
if(!f) return alert('Pili ka muna pic o mp4!');
let r=new FileReader();
r.onload=e=>{try{localStorage.setItem('inv_bg',e.target.result);localStorage.setItem('inv_bg_type',f.type.startsWith('video')?'video':'image');showBG();alert('Na-save na! Pic/Video + Sound kasama!')}catch{alert('Masyadong malaki! <2MB lang Love')}}; r.readAsDataURL(f);
}
function uploadMusic(){
let f=document.getElementById('musicFile').files[0];
if(!f) return alert('Pili ka music!');
let r=new FileReader();
r.onload=e=>{try{localStorage.setItem('inv_music',e.target.result);audio.src=e.target.result;alert('Music na-save!')}catch{alert('Malaki music!')}}; r.readAsDataURL(f);
}
function playMusic(){if(!audio.src) return alert('Upload ka muna music!'); audio.play()}
function copyLink(){navigator.clipboard.writeText(linkBox.value).then(()=>alert('Na-copy na link!'))}
function clearAll(){localStorage.clear();location.reload()}
if(localStorage.getItem('inv_bg')) showBG();
let m=localStorage.getItem('inv_music'); if(m) audio.src=m;
</script>
</body>
</html>
