<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Invitation - Kristine</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:white;font-family:Arial;min-height:100vh;overflow-y:auto}
.envelope{position:fixed;inset:0;background:#ff8fab;display:flex;flex-direction:column;justify-content:center;align-items:center;z-index:200;cursor:pointer}
.envelope.hide{display:none}
.wrap{width:100%;max-width:400px;margin:0 auto;padding:15px;text-align:center;padding-bottom:50px}
.card{width:100%;height:480px;background:white;border:2px solid #ffe0ec;border-radius:25px;position:relative;overflow:hidden;box-shadow:0 8px 20px rgba(0,0,0,0.1)}
#media{position:absolute;inset:0;z-index:1}
#media img,#media video{width:100%;height:100%;object-fit:cover}
.dragText{position:absolute;left:50px;top:150px;z-index:10;font-family:cursive;font-size:28px;color:#ff2e7a;cursor:grab;user-select:none;padding:8px 12px;background:rgba(255,255,255,0.7);border-radius:10px;border:1px dashed #ff8fab;min-width:120px}
.dragText.locked{cursor:text;border:1px solid transparent;background:transparent}
.dragText:focus{outline:2px solid #ff2e7a;background:white}
.outside{margin:20px 0}
.outside h1{font-family:cursive;font-size:32px;color:#ff2e7a;margin:5px 0}
.controls{background:#fff0f5;border-radius:20px;padding:15px;margin-top:15px;text-align:center}
button{background:#ff2e7a;color:white;border:none;padding:11px 16px;border-radius:20px;margin:6px;width:92%;font-size:14px;font-weight:bold}
button.small{width:auto;padding:8px 14px;font-size:12px;background:#333}
input{width:92%;margin:8px 0;font-size:12px}
.link{width:92%;padding:8px;border:1px solid #ddd;border-radius:8px;font-size:11px;background:white}
.balloon{position:fixed;font-size:24px;bottom:-50px;animation:fly 7s infinite linear;pointer-events:none;z-index:0}
@keyframes fly{0%{transform:translateY(0)}100%{transform:translateY(-130vh)}}
</style>
</head>
<body>

<div class="balloon" style="left:5%">🎈</div>
<div class="balloon" style="left:30%;animation-delay:1s">🎉</div>
<div class="balloon" style="left:70%;animation-delay:0.5s">🎈</div>

<div class="envelope" id="env" onclick="openEnv()">
<div style="font-size:80px">💌</div>
<h2 style="color:white;margin:10px">You are Invited!</h2>
<p style="color:white">Tap to Open</p>
</div>

<div class="wrap">
<div class="card" id="card">
<div id="media"></div>
<div id="hiText" class="dragText" contenteditable="true">Hi Kristine</div>
</div>

<div class="outside">
<h1>You are invited</h1>
<p>💖 Drag & Edit yung Hi Kristine sa puti 💖</p>
</div>

<div class="controls">
<button class="small" onclick="editText()">✏️ EDIT TEXT</button>
<button class="small" onclick="saveAll()">💾 SAVE (lock drag)</button>
<button class="small" onclick="unlockDrag()">🔓 UNLOCK DRAG</button>

<hr style="margin:12px 0">

<input type="file" id="picFile" accept="image/*,video/mp4">
<button onclick="uploadPic()">⬇️ UPLOAD PHOTO / VIDEO MP4 (kahit mataas)</button>

<input type="file" id="musicFile" accept="audio/*,video/mp4">
<button onclick="uploadMusic()">⬇️ UPLOAD SOUND MP4 / MP3 (kahit mataas)</button>
<button onclick="playMusic()">▶️ PLAY SOUND</button>

<hr style="margin:12px 0">

<input id="linkBox" class="link" readonly>
<button onclick="copyLink()">📋 COPY LINK</button>
<button onclick="clearAll()" style="background:#888">🗑️ CLEAR / BACK TO PUTI</button>
<p style="font-size:10px;color:gray;margin-top:8px">Pag na-save mo, hindi na mawawala kahit i-refresh. Pag sinend link, same design makikita pag same phone. Para sa ibang phone, upload mo muna files sa GitHub mo.</p>
</div>
</div>

<audio id="myAudio" loop></audio>

<script>
const hiText=document.getElementById('hiText');
const media=document.getElementById('media');
const audio=document.getElementById('myAudio');
const card=document.getElementById('card');
let isDragging=false, startX, startY, initX, initY, locked=false;

document.getElementById('linkBox').value=location.href;

function openEnv(){document.getElementById('env').classList.add('hide'); if(audio.src) audio.play().catch(()=>{})}

// DRAG
hiText.addEventListener('mousedown', startDrag);
hiText.addEventListener('touchstart', startDrag, {passive:false});
function startDrag(e){
if(locked) return;
isDragging=true;
let p=e.touches?e.touches[0]:e;
startX=p.clientX; startY=p.clientY;
initX=hiText.offsetLeft; initY=hiText.offsetTop;
hiText.style.cursor='grabbing';
}
window.addEventListener('mousemove', onDrag);
window.addEventListener('touchmove', onDrag, {passive:false});
window.addEventListener('mouseup', stopDrag);
window.addEventListener('touchend', stopDrag);
function onDrag(e){
if(!isDragging||locked) return;
e.preventDefault();
let p=e.touches?e.touches[0]:e;
hiText.style.left=(initX + p.clientX - startX)+'px';
hiText.style.top=(initY + p.clientY - startY)+'px';
}
function stopDrag(){isDragging=false; hiText.style.cursor=locked?'text':'grab';}

function editText(){locked=false; hiText.classList.remove('locked'); hiText.focus();}
function unlockDrag(){locked=false; hiText.classList.remove('locked'); alert('Pwede na ulit i-drag!');}
function saveAll(){
locked=true; hiText.classList.add('locked');
localStorage.setItem('inv_text', hiText.innerText);
localStorage.setItem('inv_x', hiText.style.left);
localStorage.setItem('inv_y', hiText.style.top);
localStorage.setItem('inv_locked','1');
alert('Na-save na! Hindi na ma-drag pero pwede pa ma-edit pag pinindot EDIT. Hindi mawawala kahit refresh!');
}
function uploadPic(){
let f=document.getElementById('picFile').files[0];

let url=URL.createObjectURL(f);
