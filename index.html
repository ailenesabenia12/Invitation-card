<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Invitation Card</title>
<style>
body { margin:0; font-family:Arial; display:flex; justify-content:center; align-items:center; min-height:100vh; background:#ffeef5; }
.card { width:90%; max-width:350px; background:white; border-radius:20px; overflow:hidden; box-shadow:0 10px 30px rgba(0,0,0,0.2); text-align:center; position:relative; }
.media-box { width:100%; height:350px; background:#ddd; position:relative; overflow:hidden; display:flex; align-items:center; justify-content:center; }
.media-box img,.media-box video { width:100%; height:100%; object-fit:cover; }
.balloons { font-size:30px; position:absolute; top:10px; left:0; right:0; }
.content { padding:20px; }
h2 { color:#ff4d88; margin:10px 0; }
input { margin:5px; }
button { background:#ff4d88; color:white; border:none; padding:8px 15px; border-radius:10px; margin:5px; }
</style>
</head>
<body>
<div class="card">
  <div class="media-box" id="mediaBox">
    <span id="placeholder">🎂 No media yet</span>
  </div>
  <div class="content">
    <div class="balloons">🎈🎉🎈</div>
    <h2>You're Invited!</h2>
    <p>Celebration ni Ailene!</p>

    <input type="file" id="bgFile" accept="image/*,video/mp4">
    <button onclick="uploadBG()">UPLOAD PIC / VIDEO</button><br>

    <input type="file" id="musicFile" accept="audio/*">
    <button onclick="uploadMusic()">UPLOAD MUSIC MP3</button><br>

    <button onclick="playMusic()">▶️ PLAY MUSIC</button>
    <button onclick="clearAll()">🗑️ CLEAR</button>
    <p style="font-size:11px;color:gray;">Tip: Pag na-upload mo na, punta ka sa GitHub repo mo at i-upload din yung pic.mp4 at music.mp3 para permanent, hindi na mawawala kahit mag clear history!</p>
  </div>
</div>
<audio id="myAudio" loop></audio>

<script>
let bgData = localStorage.getItem('inv_bg');
let bgType = localStorage.getItem('inv_bg_type');
let musicData = localStorage.getItem('inv_music');

function showBG(){
  const box = document.getElementById('mediaBox');
  if(!bgData){ box.innerHTML='<span>🎂 No media yet</span>'; return; }
  if(bgType==='video'){
    box.innerHTML=`<video src="${bgData}" autoplay loop muted playsinline></video>`;
  } else {
    box.innerHTML=`<img src="${bgData}">`;
  }
}
function uploadBG(){
  const file = document.getElementById('bgFile').files[0];
  if(!file) return alert('Pili ka muna pic o mp4!');
  const reader = new FileReader();
  reader.onload = e => {
    bgData = e.target.result;
    bgType = file.type.startsWith('video')? 'video' : 'image';
    try{
      localStorage.setItem('inv_bg', bgData);
      localStorage.setItem('inv_bg_type', bgType);
      showBG();
      alert((bgType==='video'?'VIDEO':'PIC')+' na-save! Kahit i-refresh, nandyan pa!');
    } catch(err){ alert('Masyadong malaki yung file Love! Maliit na pic/video lang ( < 2MB )'); }
  };
  reader.readAsDataURL(file);
}
function uploadMusic(){
  const file = document.getElementById('musicFile').files[0];
  if(!file) return alert('Pili ka muna MP3!');
  const reader = new FileReader();
  reader.onload = e => {
    musicData = e.target.result;
    try{
      localStorage.setItem('inv_music', musicData);
      document.getElementById('myAudio').src = musicData;
      alert('MUSIC na-save! Pindutin PLAY MUSIC para tumugtog!');
    } catch(err){ alert('Masyadong malaki music mo Love! Mas maliit na MP3 lang'); }
  };
  reader.readAsDataURL(file);
}
function playMusic(){
  const audio = document.getElementById('myAudio');
  if(musicData) audio.src = musicData;
  if(!audio.src) return alert('Mag upload ka muna ng music!');
  audio.play().then(()=>alert('Tumutugtog na! 🎵')).catch(()=>alert('Pindutin ulit PLAY, bawal auto-play ni phone!'));
}
function clearAll(){
  localStorage.clear();
  location.reload();
}
// load pag bukas
if(bgData) showBG();
if(musicData) document.getElementById('myAudio').src = musicData;
</script>
</body>
</html>
