<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>happy Birthday - Final Fixed</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#ffeef0;font-family:Arial,sans-serif}
#welcome{position:fixed;inset:0;background:linear-gradient(135deg,#ff9a9e,#ff6b81);z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;color:white;text-align:center;cursor:pointer}
.card{width:92%;max-width:360px;margin:15px auto;aspect-ratio:396/559;background:#000;border-radius:22px;overflow:hidden;position:relative;box-shadow:0 15px 35px rgba(0,0,0,0.3)}
#bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:10}
#guest{position:absolute;z-index:50;background:#ff1744;color:white;padding:9px 20px;border-radius:20px;border:2px solid white;cursor:grab;touch-action:none;font-weight:700;min-width:110px;text-align:center;white-space:nowrap}
.btn{width:100%;padding:11px;border:none;border-radius:10px;font-weight:700;margin:5px 0;cursor:pointer}
</style>
</head>
<body>
<div id="welcome" onclick="startParty()">
<h1 style="font-size:34px">💌 Birthday Party</h1>
<p>Ailene - June 12</p>
<div style="background:white;color:#ff2e63;padding:14px 32px;border-radius:30px;margin-top:18px;font-weight:800">👆 TAP TO OPEN + MUSIC</div>
</div>

<div style="max-width:380px;margin:0 auto;padding:12px">
<div class="card" id="card">
<img id="bg" src="card.jpg?v=final2">
<div id="guest" contenteditable="true" style="top:78%;left:50%;transform:translateX(-50%)">Hi, Ailene! ❤️</div>
</div>

<div id="owner" style="background:white;border-radius:14px;padding:12px;margin-top:12px;border:3px solid #ff6b81">
<h3 style="font-size:12px;color:#ff1744">✅ FINAL FIX - Drag Save!</h3>
<p style="font-size:10px;color:#666">1. Drag mo sa baba 2. Gawa Link 3. Nasa baba na sa link!</p>
<button class="btn" style="background:#00c853;color:white" onclick="savePos()">💾 SAVE POSITION SA BABA</button>
<input id="nameBox" value="Ailene" style="width:100%;padding:9px;border-radius:8px;border:1px solid #ddd;margin-top:8px" placeholder="Name ng guest">
<button class="btn" style="background:#222;color:white" onclick="makeLink()">🔗 GAWA LINK (KASAMA BABA!)</button>
<div id="linkBox" style="display:none;margin-top:8px;background:#f5f5f5;padding:8px;border-radius:8px;font-size:11px;word-break:break-all"></div>
<button class="btn" style="background:#f5f5f5" onclick="resetPos()">↺ Reset sa Taas</button>
</div>
</div>

<audio id="audio" loop><source src="https://cdn.pixabay.com/download/audio/2022/03/24/audio_ee6d6a4e49.mp3"></audio>

<script>
let bg=document.getElementById('bg'), guest=document.getElementById('guest'), card=document.getElementById('card'), audio=document.getElementById('audio');
let cur=JSON.parse(localStorage.getItem('posAilene')||'{"top":"78%","left":"50%","transform":"translateX(-50%)"}');
guest.style.top=cur.top; guest.style.left=cur.left; guest.style.transform=cur.transform;
if(cur.top.includes('px')) guest.style.transform='none';

function startParty(){document.getElementById('welcome').style.display='none';audio.volume=0.9;audio.play().catch(()=>{});}

let drag=false,sx,sy,sl,st;
guest.addEventListener('pointerdown',e=>{
 if(document.activeElement===guest) return;
 drag=true; sx=e.clientX; sy=e.clientY;
 let r=guest.getBoundingClientRect(), cr=card.getBoundingClientRect();
 sl=r.left-cr.left; st=r.top-cr.top;
 guest.setPointerCapture(e.pointerId);
});
guest.addEventListener('pointermove',e=>{
 if(!drag) return;
 let nl=sl+(e.clientX-sx), nt=st+(e.clientY-sy);
 guest.style.left=nl+'px'; guest.style.top=nt+'px'; guest.style.transform='none';
 cur={top:nt+'px', left:nl+'px', transform:'none'};
});
guest.addEventListener('pointerup',()=>{drag=false; localStorage.setItem('posAilene', JSON.stringify(cur));});

function savePos(){localStorage.setItem('posAilene', JSON.stringify(cur)); alert('✅ Na-save position sa baba! Ngayon gumawa ka ng link!');}
function resetPos(){guest.style.top='15px'; guest.style.left='50%'; guest.style.transform='translateX(-50%)'; cur={top:'15px',left:'50%',transform:'translateX(-50%)'}; localStorage.setItem('posAilene', JSON.stringify(cur));}

function makeLink(){
 let n=document.getElementById('nameBox').value || guest.innerText.replace(/Hi,|!|❤️/g,'').trim() || 'Ailene';
 guest.innerText='Hi, '+n+'! ❤️';
 let posData=btoa(JSON.stringify(cur));
 let link=location.origin+location.pathname+'?name='+encodeURIComponent(n)+'&pos='+encodeURIComponent(posData);
 let b=document.getElementById('linkBox'); b.style.display='block';
 b.innerHTML=link+'<br><br><button onclick="navigator.clipboard.writeText(\''+link+'\')" style="width:100%;padding:8px;background:#00c4cc;color:white;border:none;border-radius:8px">📋 COPY LINK</button><br><br><small style="color:green">✅ Kasama na position sa baba! Hindi na babalik sa taas!</small>';
 navigator.clipboard.writeText(link);
}

let p=new URLSearchParams(location.search);
if(p.get('name')){
 guest.innerText='Hi, '+p.get('name')+'! ❤️';
 document.getElementById('owner').style.display='none';
 if(p.get('pos')){
  try{let d=JSON.parse(atob(decodeURIComponent(p.get('pos')))); guest.style.top=d.top; guest.style.left=d.left; guest.style.transform=d.transform;}catch(e){}
 }
}
</script>
</body>
</html>
