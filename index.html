<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lovemae's Birthday - Dec 29</title>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@400;700&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Poppins',sans-serif; min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; background: #ffc2d1; transition: 0.5s; overflow-x:hidden;}
  .top-bar{position:fixed; top:0; left:0; right:0; background:rgba(255,255,255,0.9); backdrop-filter:blur(10px); padding:10px; display:flex; gap:8px; justify-content:center; z-index:100; flex-wrap:wrap;}
  .top-bar button{border:none; padding:8px 14px; border-radius:20px; font-weight:700; cursor:pointer; font-size:13px;}
  .design-btn{background:#ff6b81; color:white;}
  .design-btn.active{background:#ff1744; transform:scale(1.05);}
  .music-btn{background:#222; color:white; animation: pulse 1.5s infinite;}
  @keyframes pulse{0%{transform:scale(1)}50%{transform:scale(1.05)}100%{transform:scale(1)}}
  
  .card{margin-top:70px; background:white; width:92%; max-width:380px; border-radius:30px; padding:30px 20px; text-align:center; box-shadow:0 20px 40px rgba(0,0,0,0.2); position:relative; overflow:hidden; transition:0.5s;}
  
  /* THEMES */
  body.theme1{background: linear-gradient(135deg,#ff9a9e,#fecfef);}
  body.theme2{background:#ffb3c6 url('https://images.unsplash.com/photo-1511285560929-80b456fea0bc?q=80&w=400') center/cover; }
  body.theme3{background: linear-gradient(180deg,#fff0f5,#ffc8dd);}
  
  .theme2 .card{border:3px solid #fff; background:rgba(255,255,255,0.92);}
  .theme3 .card{border:5px dashed #ff6b81;}
  
  h1{font-family:'Great Vibes',cursive; font-size:42px; color:#ff2e63; margin:10px 0;}
  .name{font-size:32px; font-weight:700; color:#ff4757; margin:15px 0; min-height:40px;}
  .date-badge{background:#ff6b81; color:white; padding:10px 22px; border-radius:30px; display:inline-block; font-weight:700; margin:15px 0;}
  .cake{font-size:80px; margin:10px 0; animation: bounce 2s infinite;}
  @keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
  .info{margin:8px 0; font-size:16px;}
  
  canvas{position:fixed; top:0; left:0; width:100%; height:100%; pointer-events:none; z-index:50;}
</style>
</head>
<body class="theme1">

<canvas id="confetti"></canvas>

<div class="top-bar">
  <button class="design-btn active" onclick="setTheme(1)">🎀 Pink Simple</button>
  <button class="design-btn" onclick="setTheme(2)">🕊️ Wedding</button>
  <button class="design-btn" onclick="setTheme(3)">🎂 Birthday Cake</button>
  <button class="music-btn" onclick="playMusic()">🔊 Play Happy Birthday</button>
</div>

<div class="card" id="card">
  <div style="font-size:30px;">🎉 You're Invited! 🎉</div>
  <div class="name" id="guestName">Hi Friend!</div>
  <p>Join us to celebrate</p>
  <h1 id="title">Lovemae's Birthday</h1>
  <div class="cake" id="cakeIcon">🎂</div>
  <div class="date-badge">December 29</div>
  <p style="margin-top:15px;">We can't wait to see you!</p>
  <div class="info">📍 Venue: Quezon City Circle</div>
  <div class="info">🕕 Time: 6PM</div>
  <p style="margin-top:15px; font-family:'Great Vibes'; font-size:28px; color:#ff6b81;">You are invited</p>
</div>

<audio id="bdayAudio" loop>
  <source src="https://www.singing-bell.com/wp-content/uploads/2016/03/Happy-Birthday-Song-cheerful-Singing-Bell.mp3" type="audio/mpeg">
</audio>

<script>
// Name magic ?name=
const params = new URLSearchParams(window.location.search);
const name = params.get('name');
if(name){ document.getElementById('guestName').innerHTML = `Hi, ${name}! ❤️`; }

// Theme switcher
function setTheme(n){
  document.body.className = 'theme'+n;
  document.querySelectorAll('.design-btn').forEach(b=>b.classList.remove('active'));
  event.target.classList.add('active');
  const title = document.getElementById('title');
  const cake = document.getElementById('cakeIcon');
  if(n==1){ title.innerText="Lovemae's Birthday"; cake.innerText="🎂"; }
  if(n==2){ title.innerText="Lovemae's Birthday"; cake.innerText="💍🕊️"; }
  if(n==3){ title.innerText="Birthday Party\nlovemae"; cake.innerHTML="🎈🎂🎈"; }
  fireConfetti();
}

// Music
let playing=false;
function playMusic(){
  const audio=document.getElementById('bdayAudio');
  if(!playing){ audio.play(); event.target.innerText="⏸️ Pause Music"; playing=true; fireConfetti(); }
  else{ audio.pause(); event.target.innerText="🔊 Play Happy Birthday"; playing=false; }
}

// Confetti
const canvas=document.getElementById('confetti'); const ctx=canvas.getContext('2d');
canvas.width=window.innerWidth; canvas.height=window.innerHeight;
let pieces=[];
function fireConfetti(){
  for(let i=0;i<100;i++) pieces.push({x:Math.random()*canvas.width, y:-10, r:Math.random()*10+5, c:`hsl(${Math.random()*360},100%,50%)`, vy:Math.random()*5+2, vx:Math.random()*6-3});
}
function loop(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  pieces.forEach((p,i)=>{
    ctx.fillStyle=p.c; ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,6.28); ctx.fill();
    p.y+=p.vy; p.x+=p.vx; if(p.y>canvas.height) pieces.splice(i,1);
  }); requestAnimationFrame(loop);
}
loop(); fireConfetti();

// Try auto play after click anywhere
document.body.addEventListener('click', ()=>{ if(!playing){ /* user gesture */ } }, {once:true});
</script>
</body>
</html>
